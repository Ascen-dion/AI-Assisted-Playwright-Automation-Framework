# ══════════════════════════════════════════════════════════════════════════════
# TIIS — Test Impact Intelligence System
# GitHub Actions Workflow
#
# SETUP INSTRUCTIONS (one-time):
# ─────────────────────────────
# Place this file at:
#   aava-ecom-demo/.github/workflows/test-impact-analysis.yml
#
# Add these secrets in the aava-ecom-demo repository settings:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   FRAMEWORK_REPO_TOKEN   — GitHub PAT with read access to:
#                            Ascen-dion/AI-Assisted-Test-Automation-Framework
#                            (Settings → Developer settings → Personal access tokens)
#
#   OPENROUTER_API_KEY     — API key from https://openrouter.ai  (free tier available)
#                            OR use OPENAI_API_KEY / ANTHROPIC_API_KEY
#
# That's it. The workflow runs automatically on every pull request.
# ══════════════════════════════════════════════════════════════════════════════

name: "🧠 Test Impact Analysis"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Optional: only trigger when app source files change (not docs/config)
    # paths:
    #   - "frontend/**"
    #   - "backend/**"

jobs:
  analyze-impact:
    name: "TIIS — Analyze PR Impact"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # needed to post the report as a PR comment
      contents: read

    steps:
      # ── 1. Checkout the automation framework (contains TIIS engine) ─────────
      - name: "Checkout AI-Assisted-Playwright-Automation-Framework"
        uses: actions/checkout@v4
        with:
          repository: Ascen-dion/AI-Assisted-Test-Automation-Framework
          ref: poc_mobile_automation_mobile_wright
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}
          path: automation-framework

      # ── 2. Node.js setup ────────────────────────────────────────────────────
      - name: "Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: automation-framework/package.json

      # ── 3. Install framework dependencies ───────────────────────────────────
      - name: "Install dependencies"
        working-directory: automation-framework
        run: npm ci --prefer-offline

      # ── 4. Run the TIIS analysis ─────────────────────────────────────────────
      - name: "Run Test Impact Analysis"
        id: tiis
        working-directory: automation-framework
        run: node tiis/run-impact-analysis.js --pr=${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Uncomment the provider you prefer:
          # AI_PROVIDER: openai
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # AI_PROVIDER: anthropic
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # ── 5. Post impact report as a PR comment ────────────────────────────────
      - name: "Post Impact Report as PR Comment"
        if: always()   # post even if analysis had warnings
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'automation-framework/tiis/reports/latest-impact-report.json';

            // Graceful fallback if report file doesn't exist
            if (!fs.existsSync(reportPath)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ **TIIS** — Impact analysis could not complete. Check the Actions log for details.',
              });
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const meta   = report.metadata || {};
            const risk   = (meta.overallRisk || 'unknown').toUpperCase();
            const EMOJI  = { CRITICAL: '🔴', HIGH: '🟠', MEDIUM: '🟡', LOW: '🟢' };
            const re     = EMOJI[risk] || '⚪';

            // Build impacted areas table rows
            const rows = [
              ...(report.impactedAreas?.critical || []).map(a => `| 🔴 Critical | \`${a.feature}\` | ${a.reason} |`),
              ...(report.impactedAreas?.high     || []).map(a => `| 🟠 High     | \`${a.feature}\` | ${a.reason} |`),
              ...(report.impactedAreas?.medium   || []).map(a => `| 🟡 Medium   | \`${a.feature}\` | ${a.reason} |`),
              ...(report.impactedAreas?.low      || []).map(a => `| 🟢 Low      | \`${a.feature}\` | ${a.reason} |`),
            ];

            const impactTable = rows.length
              ? `| Priority | Feature | Reason |\n|---|---|---|\n${rows.join('\n')}`
              : '_No impacted areas detected._';

            // Coverage gaps
            const gaps = (report.coverageGaps || [])
              .map(g => `- ❌ **${g.feature}**: ${g.recommendation}`)
              .join('\n') || '_None detected_';

            // Regression suite
            const testFiles = (report.recommendedRegressionSuite?.testFiles || [])
              .map(f => `- \`${f}\``)
              .join('\n') || '_No existing tests cover impacted areas — manual testing required_';

            const runCmd = report.recommendedRegressionSuite?.runCommand || 'npx playwright test';

            // Safe to skip
            const skip = (report.safeToSkip || [])
              .map(s => `- ${s}`)
              .join('\n') || '_None listed_';

            const stats = meta.stats || {};

            const body = `## ${re} TIIS — Test Impact Report

> ${report.executiveSummary || ''}

| | |
|---|---|
| **PR** | #${meta.pr?.number} — ${meta.pr?.title} |
| **Author** | ${meta.pr?.author} |
| **Change Type** | ${meta.changeType} |
| **Overall Risk** | ${re} **${risk}** |
| **Files Changed** | ${stats.filesChanged} |
| **Test Files Found** | ${stats.testFilesFound} |
| **Features Covered** | ${stats.coveredFeatures} / ${(stats.coveredFeatures || 0) + (stats.gapFeatures || 0)} |

---

### 📍 Impacted Areas

${impactTable}

---

### ⚠️ Coverage Gaps (no tests exist)

${gaps}

---

### ✅ Recommended Regression Suite

${testFiles}

\`\`\`bash
${runCmd}
\`\`\`

---

### 🟢 Safe to Skip

${skip}

---
<sub>🤖 Generated by [Test Impact Intelligence System (TIIS)](https://github.com/Ascen-dion/AI-Assisted-Test-Automation-Framework) · ${new Date().toISOString()}</sub>`;

            // Delete previous TIIS comment on this PR (keep thread clean)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const c of comments.data) {
              if (c.body.includes('TIIS — Test Impact Report') && c.user.type === 'Bot') {
                await github.rest.issues.deleteComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            // Post fresh comment
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── 6. Upload report as workflow artifact ────────────────────────────────
      - name: "Upload Impact Report artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "tiis-impact-report-PR${{ github.event.pull_request.number }}"
          path: |
            automation-framework/tiis/reports/latest-impact-report.json
            automation-framework/tiis/reports/latest-impact-report.html
          retention-days: 30
