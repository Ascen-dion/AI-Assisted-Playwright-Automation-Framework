name: MobileWright Tests

on:
  workflow_dispatch:

jobs:
  mobile:
    name: Mobile Tests (Android API 30)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-30" "emulator" "system-images;android-30;google_apis;x86_64"

      - name: Create AVD (Pixel 5 API 30)
        run: |
          echo "no" | avdmanager create avd \
            --name "Pixel_5_API_30" \
            --abi "google_apis/x86_64" \
            --package "system-images;android-30;google_apis;x86_64" \
            --device "pixel_5" \
            --force

      - name: Start emulator and run MobileWright tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: Pixel_5_API_30
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "Installing APKs"
            adb wait-for-device
            adb install -r mobile/apk/GolfGalaxy.apk
            adb install -r mobile/apk/DSG.apk

            echo "Running Golf Galaxy mobile tests"
            npx mobilewright test mobile/tests/golfgalaxy-smoke.spec.js --reporter=list

      - name: Upload Mobile HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilewright-report-${{ github.run_number }}
          path: mobile/reports/html/
          retention-days: 30

      - name: Upload test-results artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilewright-test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 30

      - name: Publish job summary
        if: always()
        run: |
          echo "## MobileWright Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: macos-latest" >> $GITHUB_STEP_SUMMARY
          echo "- Emulator: Pixel 5 API 30" >> $GITHUB_STEP_SUMMARY
          echo "- APKs: GolfGalaxy.apk, DSG.apk" >> $GITHUB_STEP_SUMMARY
