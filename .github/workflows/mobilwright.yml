name: MobileWright Tests

on:
  workflow_dispatch:

jobs:
  mobile:
    name: Mobile Tests (Android API 30)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-30" "emulator" "system-images;android-30;google_apis;x86_64"

      - name: Create AVD (Pixel 5 API 30)
        run: |
          echo "no" | avdmanager create avd \
            --name "Pixel_5_API_30" \
            --abi "google_apis/x86_64" \
            --package "system-images;android-30;google_apis;x86_64" \
            --device "pixel_5" \
            --force

      - name: Start emulator and run MobileWright tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TESTRAIL_HOST: ${{ secrets.TESTRAIL_HOST }}
          TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
          TESTRAIL_SUITE_ID: ${{ secrets.TESTRAIL_SUITE_ID }}
          TESTRAIL_SECTION_ID: ${{ secrets.TESTRAIL_SECTION_ID }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: Pixel_5_API_30
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r mobile/apk/GolfGalaxy.apk
            adb install -r mobile/apk/DSG.apk
            bash scripts/start-mobilecli.sh
            npx mobilewright test mobile/tests/golfgalaxy-smoke.spec.mjs --reporter=list

      - name: Verify report output path
        if: always()
        run: |
          echo "Checking mobile/reports/html"
          ls -la mobile/reports || true
          ls -la mobile/reports/html || true

      - name: Upload Mobile HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilewright-report-${{ github.run_number }}
          path: mobile/reports/html
          retention-days: 30

      - name: Upload test-results artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilewright-test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 30

      - name: Send Email Notification
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [Mobile Tests] ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} - Run #${{ github.run_number }}
          to: ${{ secrets.EMAIL_TO }}
          from: MobileWright AI Framework <${{ secrets.EMAIL_USERNAME }}>
          html_body: file://email-body.html

      - name: Comment PR with Mobile Test Results
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            const comment = `## 📱 Mobile Test Results

            **Status:** ${status === 'success' ? '✅ Passed' : '❌ Failed'}
            **Run:** [#${{ github.run_number }}](${runUrl})

            ### 📊 Reports Available
            - [View MobileWright Report](${runUrl})
            - [Download Test Results](${runUrl})

            ---
            *Automated by MobileWright AI Framework*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Publish job summary
        if: always()
        run: |
          echo "## 📱 MobileWright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: ubuntu-latest (KVM)" >> $GITHUB_STEP_SUMMARY
          echo "- Emulator: Pixel 5 API 30" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- APKs: GolfGalaxy.apk, DSG.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- MobileWright Report: mobilewright-report-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test Results: mobilewright-test-results-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Full Results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
