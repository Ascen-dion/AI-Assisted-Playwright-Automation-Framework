name: Playwright Tests

on:
  push:
    branches: [ master, main, star_hub_green_field ]
  pull_request:
    branches: [ master, main, star_hub_green_field ]
  workflow_dispatch:
  #schedule:
    # Run tests daily at 9 AM UTC
  #  - cron: '0 9 * * *'

jobs:
  # ── Smoke: runs on every push — fast nav tests only ──────────────────────
  smoke:
    name: Smoke Tests (@smoke)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Smoke Tests
      continue-on-error: true
      env:
        HEADLESS: 'true'
        CI: 'true'
        TESTRAIL_HOST: ${{ secrets.TESTRAIL_HOST }}
        TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
        TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
        TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
        TESTRAIL_SUITE_ID: ${{ secrets.TESTRAIL_SUITE_ID }}
        TESTRAIL_SECTION_ID: ${{ secrets.TESTRAIL_SECTION_ID }}
      run: npx playwright test src/tests/ --config=config/playwright.config.js --project=chromium --grep @smoke

    - name: Upload Smoke Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smoke-results-${{ github.run_number }}
        path: test-results/
        retention-days: 7

  # ── Regression: full suite ────────────────────────────────────────────────
  test:
    name: Regression Tests (@regression)
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      continue-on-error: true
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        HEADLESS: 'true'
        CI: 'true'
        TESTRAIL_HOST: ${{ secrets.TESTRAIL_HOST }}
        TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
        TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
        TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
        TESTRAIL_SUITE_ID: ${{ secrets.TESTRAIL_SUITE_ID }}
        TESTRAIL_SECTION_ID: ${{ secrets.TESTRAIL_SECTION_ID }}
      run: npx playwright test src/tests/ --config=config/playwright.config.js --project=chromium --grep @regression

    - name: Generate test report
      if: always()
      run: |
        echo "Test execution completed"
        if [ -d "playwright-report" ]; then
          echo "Report generated successfully"
        fi

    - name: Upload Playwright Report as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ github.run_number }}
        path: playwright-report/
        retention-days: 30

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.run_number }}
        path: test-results/
        retention-days: 30

    - name: Prepare email content
      if: always()
      run: |
        node - << 'NODEOF'
        const fs = require('fs');
        const path = require('path');

        const RUN_URL = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
        const REPO    = process.env.GITHUB_REPOSITORY || '';
        const BRANCH  = process.env.GITHUB_REF_NAME  || '';
        const ACTOR   = process.env.GITHUB_ACTOR     || '';
        const RUN_NUM = process.env.GITHUB_RUN_NUMBER || '';
        const SHA     = (process.env.GITHUB_SHA || '').slice(0, 7);

        // --- parse results.json ---
        let passed = 0, failed = 0, skipped = 0, duration = 0;
        let testRows = '';

        try {
          const raw = fs.readFileSync('test-results/results.json', 'utf8');
          const report = JSON.parse(raw);

          const statusIcon  = s => s === 'passed' ? '✅' : s === 'failed' ? '❌' : s === 'skipped' ? '⏭️' : '⚠️';
          const statusColor = s => s === 'passed' ? '#28a745' : s === 'failed' ? '#dc3545' : '#6c757d';
          const ms = n => n >= 1000 ? (n/1000).toFixed(1)+'s' : n+'ms';

          // Playwright JSON: test.status = "expected"|"unexpected"|"flaky"|"skipped"
          // Actual pass/fail is in test.results[last].status = "passed"|"failed"|"timedOut"|"skipped"
          const resolveStatus = (test) => {
            const lastResult = (test.results || []).at(-1);
            if (lastResult) return lastResult.status; // "passed", "failed", "timedOut", "skipped"
            // fallback: map Playwright outcome words
            const map = { expected: 'passed', unexpected: 'failed', flaky: 'flaky', skipped: 'skipped' };
            return map[test.status] || test.status || 'unknown';
          };

          const walk = (suites, suiteName) => {
            for (const suite of (suites || [])) {
              const name = suite.title || suiteName || '';
              walk(suite.suites || [], name);
              for (const spec of (suite.specs || [])) {
                for (const test of (spec.tests || [])) {
                  const status   = resolveStatus(test);
                  const fullName = [name, spec.title].filter(Boolean).join(' › ');
                  const dur      = (test.results || []).reduce((a, r) => a + (r.duration || 0), 0);
                  const errMsg   = (test.results || [])
                    .flatMap(r => r.errors || [])
                    .map(e => (e.message || '').split('\n')[0].slice(0, 200))
                    .filter(Boolean)
                    .join('<br>');

                  if (status === 'passed')  passed++;
                  else if (status === 'failed' || status === 'timedOut') failed++;
                  else skipped++;
                  duration += dur;

                  testRows += `
                    <tr>
                      <td style="padding:8px 12px;border-bottom:1px solid #e9ecef;">
                        ${statusIcon(status)} <span style="color:${statusColor(status)};font-weight:600;">${status.toUpperCase()}</span>
                      </td>
                      <td style="padding:8px 12px;border-bottom:1px solid #e9ecef;">${fullName}</td>
                      <td style="padding:8px 12px;border-bottom:1px solid #e9ecef;color:#6c757d;">${ms(dur)}</td>
                      <td style="padding:8px 12px;border-bottom:1px solid #e9ecef;color:#dc3545;font-size:12px;">${errMsg}</td>
                    </tr>`;
                }
              }
            }
          };

          walk(report.suites || []);
        } catch(e) {
          testRows = `<tr><td colspan="4" style="padding:12px;color:#6c757d;font-style:italic;">No results.json found — tests may not have run or the file path is different.</td></tr>`;
        }

        const total = passed + failed + skipped;
        const overallColor = failed > 0 ? '#dc3545' : '#28a745';
        const overallLabel = failed > 0 ? '❌ FAILED' : '✅ PASSED';

        const html = `<!DOCTYPE html>
        <html>
        <head><meta charset="UTF-8"></head>
        <body style="margin:0;padding:0;font-family:Arial,sans-serif;background:#f4f4f4;">
          <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:20px 0;">
            <tr><td>
              <table width="700" align="center" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);">

                <!-- Header -->
                <tr><td style="background:#0066cc;padding:24px 32px;">
                  <h1 style="margin:0;color:#fff;font-size:22px;">🎭 Playwright AI Framework — Test Results</h1>
                  <p style="margin:6px 0 0;color:#cce0ff;font-size:14px;">Run #${RUN_NUM} &nbsp;·&nbsp; ${BRANCH} &nbsp;·&nbsp; ${SHA}</p>
                </td></tr>

                <!-- Overall badge -->
                <tr><td style="padding:24px 32px 0;">
                  <table cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="background:${overallColor};color:#fff;font-size:20px;font-weight:700;padding:12px 28px;border-radius:6px;">${overallLabel}</td>
                      <td style="padding-left:24px;">
                        <span style="font-size:28px;font-weight:700;color:#28a745;">${passed}</span><span style="color:#6c757d;font-size:13px;"> passed</span>&nbsp;&nbsp;
                        <span style="font-size:28px;font-weight:700;color:#dc3545;">${failed}</span><span style="color:#6c757d;font-size:13px;"> failed</span>&nbsp;&nbsp;
                        <span style="font-size:28px;font-weight:700;color:#6c757d;">${skipped}</span><span style="color:#6c757d;font-size:13px;"> skipped</span>&nbsp;&nbsp;
                        <span style="color:#6c757d;font-size:13px;">&nbsp;/&nbsp; ${total} total</span>
                      </td>
                    </tr>
                  </table>
                </td></tr>

                <!-- Meta info -->
                <tr><td style="padding:20px 32px 0;">
                  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8f9fa;border-left:4px solid #0066cc;padding:16px;border-radius:4px;">
                    <tr><td style="font-size:13px;color:#495057;line-height:1.8;">
                      <strong>Repository:</strong> ${REPO}<br>
                      <strong>Branch:</strong> ${BRANCH}<br>
                      <strong>Triggered by:</strong> ${ACTOR}<br>
                      <strong>Run:</strong> <a href="${RUN_URL}" style="color:#0066cc;">#${RUN_NUM}</a>
                    </td></tr>
                  </table>
                </td></tr>

                <!-- Test results table -->
                <tr><td style="padding:24px 32px 0;">
                  <h2 style="margin:0 0 12px;font-size:16px;color:#212529;">Test Results</h2>
                  <table width="100%" cellpadding="0" cellspacing="0" style="border-radius:6px;overflow:hidden;border:1px solid #dee2e6;">
                    <thead>
                      <tr style="background:#0066cc;color:#fff;">
                        <th style="padding:10px 12px;text-align:left;font-size:13px;width:90px;">Status</th>
                        <th style="padding:10px 12px;text-align:left;font-size:13px;">Test Name</th>
                        <th style="padding:10px 12px;text-align:left;font-size:13px;width:70px;">Duration</th>
                        <th style="padding:10px 12px;text-align:left;font-size:13px;">Error</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${testRows}
                    </tbody>
                  </table>
                </td></tr>

                <!-- CTA -->
                <tr><td style="padding:24px 32px;">
                  <a href="${RUN_URL}" style="display:inline-block;background:#0066cc;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">
                    View Full Report &amp; Artifacts →
                  </a>
                </td></tr>

                <!-- Footer -->
                <tr><td style="background:#f8f9fa;padding:16px 32px;font-size:12px;color:#6c757d;border-top:1px solid #dee2e6;">
                  Automated by Playwright AI Framework CI/CD &nbsp;·&nbsp; ${REPO}
                </td></tr>

              </table>
            </td></tr>
          </table>
        </body>
        </html>`;

        fs.writeFileSync('email-body.html', html);
        console.log(`Email prepared: ${passed} passed, ${failed} failed, ${skipped} skipped`);
        NODEOF

    - name: Zip Playwright report
      if: always()
      run: zip -r playwright-report.zip playwright-report/ || true

    - name: Send Email Notification
      if: always()
      continue-on-error: true
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: |
          [Playwright Tests] ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} - Run #${{ github.run_number }}
        to: ${{ secrets.EMAIL_TO }}
        from: Playwright AI Framework <${{ secrets.EMAIL_USERNAME }}>
        html_body: file://email-body.html
        attachments: playwright-report.zip

    - name: Comment PR with Results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
          
          const comment = `## 🎭 Playwright Test Results
          
          **Status:** ${status === 'success' ? '✅ Passed' : '❌ Failed'}
          **Run:** [#${{ github.run_number }}](${runUrl})
          
          ### 📊 Reports Available
          - [View Playwright HTML Report](${runUrl})
          - [Download Test Screenshots](${runUrl})
          
          ---
          *Automated by Playwright AI Framework*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Publish Test Results Summary
      if: always()
      run: |
        echo "## 🎭 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Playwright Report: playwright-report-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- Test Results: test-results-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "[View Full Results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
