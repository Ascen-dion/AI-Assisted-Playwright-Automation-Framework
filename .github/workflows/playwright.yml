name: Playwright Tests

on:
  push:
    branches: [master, main, sunlife_poc]
  pull_request:
    branches: [master, main, sunlife_poc]
  workflow_dispatch:
  #schedule:
  # Run tests daily at 9 AM UTC
  #  - cron: '0 9 * * *'

jobs:
  # ── Smoke: runs on every push — fast nav tests only ──────────────────────
  smoke:
    name: Smoke Tests (@smoke)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Smoke Tests
        continue-on-error: true
        env:
          HEADLESS: "true"
          CI: "true"
          TESTRAIL_HOST: ${{ secrets.TESTRAIL_HOST }}
          TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
          TESTRAIL_SUITE_ID: ${{ secrets.TESTRAIL_SUITE_ID }}
          TESTRAIL_SECTION_ID: ${{ secrets.TESTRAIL_SECTION_ID }}
        run: npx playwright test src/web/tests/ --config=config/playwright.config.js --project=chromium --grep @smoke

      - name: Upload Smoke Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7

      - name: Prepare email content
        if: always()
        run: node scripts/generate-email.js

      - name: Send Email Notification
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [Smoke Tests] ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }} - Run #${{ github.run_number }}
          to: ${{ secrets.EMAIL_TO }}
          from: Playwright AI Framework <${{ secrets.EMAIL_USERNAME }}>
          html_body: file://email-body.html

      - name: Publish Smoke Results Summary
        if: always()
        run: |
          echo "## 🎭 Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Full Results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY


