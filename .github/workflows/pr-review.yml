name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master, poc_windows_web_mobile]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # GitHub currently provides Copilot review from PR UI, not via a public Action.
  # This job posts a reminder so reviewers know how to request it.
  copilot-review-guidance:
    name: Copilot Review Guidance
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Post Copilot review guidance
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '## Copilot Review',
              '',
              'Automatic Copilot review via `github/copilot-code-review` is not available as a public GitHub Action.',
              'To request AI review in this PR, use the GitHub UI:',
              '1. Open the PR',
              '2. Click **Reviewers**',
              '3. Select **Copilot** (if enabled for your org/repo)',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Copilot Review')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  framework-conventions:
    name: Framework Convention Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      CHANGED_FILES_PATH: /tmp/changed-files.txt
      CONVENTION_REPORT_PATH: /tmp/convention-report.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure base branch is available
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > "$CHANGED_FILES_PATH"
          echo "Changed files:"
          cat "$CHANGED_FILES_PATH"

      - name: Run framework convention checks
        id: convention-check
        run: node .github/scripts/check-pr-conventions.js "$CHANGED_FILES_PATH"
        env:
          CONVENTION_REPORT_PATH: ${{ env.CONVENTION_REPORT_PATH }}
        continue-on-error: true

      - name: Post convention check results
        uses: actions/github-script@v7
        if: always()
        env:
          CONVENTION_REPORT_PATH: ${{ env.CONVENTION_REPORT_PATH }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = process.env.CONVENTION_REPORT_PATH || '/tmp/convention-report.json';
            let report = { violations: [], warnings: [], passed: [] };

            if (fs.existsSync(reportPath)) {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            }

            const hasViolations = report.violations.length > 0;
            const hasWarnings = report.warnings.length > 0;

            let body = '## 🤖 PR Review Agent — Framework Convention Check\n\n';

            if (!hasViolations && !hasWarnings) {
              body += '✅ **All framework conventions passed!** No issues found.\n\n';
            }

            if (hasViolations) {
              body += `### ❌ Violations (${report.violations.length})\n`;
              body += '_These must be fixed before merging:_\n\n';
              report.violations.forEach(v => {
                body += `- **${v.file}** (line ${v.line || 'N/A'}): ${v.message}\n`;
              });
              body += '\n';
            }

            if (hasWarnings) {
              body += `### ⚠️ Warnings (${report.warnings.length})\n`;
              body += '_Review recommended:_\n\n';
              report.warnings.forEach(w => {
                body += `- **${w.file}**: ${w.message}\n`;
              });
              body += '\n';
            }

            if (report.passed.length > 0) {
              body += `<details>\n<summary>✅ Passed checks (${report.passed.length})</summary>\n\n`;
              report.passed.forEach(p => {
                body += `- ${p}\n`;
              });
              body += '\n</details>\n';
            }

            body += '\n---\n_Reviewed by PR Review Agent workflow_';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('PR Review Agent — Framework Convention Check')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (hasViolations) {
              core.setFailed(`Framework convention violations found: ${report.violations.length}`);
            }
