name: 🏥 Medtronic India Tests

on:
  push:
    branches: [master, main, Medtronic]
    paths:
      - 'src/web/**'
      - 'src/shared/**'
      - 'config/**'
      - '.github/workflows/medtronic-tests.yml'
  pull_request:
    branches: [master, main, Medtronic]
    paths:
      - 'src/web/**'
      - 'src/shared/**'
      - 'config/**'
  schedule:
    # Nightly regression — 06:00 UTC weekdays
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Which tests to run'
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - regression
          - all
          - homepage
          - patients
          - hcp
          - our-company
          - our-impact
          - footer
      run_reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual smoke check'

# ── Shared env block ─────────────────────────────────────────────────────────
env:
  CI: 'true'
  HEADLESS: 'true'
  NODE_TLS_REJECT_UNAUTHORIZED: '0'
  BASE_URL: 'https://www.medtronic.com'
  # TestRail run name is auto-detected by the reporter from source paths,
  # but we set it explicitly here for clarity in CI.
  TESTRAIL_RUN_NAME_PREFIX: 'Medtronic India Automation'

jobs:
  # ── Smoke: fast nav tests — runs on every push ─────────────────────────────
  smoke:
    name: 🏥 Smoke Tests (@smoke)
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(fromJSON('["smoke","all"]'), github.event.inputs.test_scope)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: 📋 Log run context
        run: |
          echo "=========================================="
          echo " Medtronic India Tests — Run #${{ github.run_number }}"
          echo "=========================================="
          echo " Branch  : ${{ github.ref_name }}"
          echo " Actor   : ${{ github.actor }}"
          echo " Trigger : ${{ github.event_name }}"
          echo " Scope   : ${{ github.event.inputs.test_scope || 'smoke' }}"
          echo " SHA     : ${{ github.sha }}"
          echo "=========================================="

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Smoke Tests
        continue-on-error: true
        env:
          TESTRAIL_HOST:       ${{ secrets.TESTRAIL_HOST }}
          TESTRAIL_USER:       ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY:    ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
          TESTRAIL_SUITE_ID:   ${{ secrets.TESTRAIL_SUITE_ID }}
          TESTRAIL_SECTION_ID: ${{ secrets.TESTRAIL_SECTION_ID }}
        run: |
          npx playwright test src/web/tests/nav/medtronic-*.spec.js \
            --config=config/playwright.config.js \
            --project=chromium \
            --grep @smoke

      - name: 📦 Upload Smoke Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medtronic-smoke-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # ── Regression: full suite — PRs, nightly, manual ──────────────────────────
  regression:
    name: 🏥 Regression Tests (@regression)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["regression","all"]'), github.event.inputs.test_scope))
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: 📋 Log run context
        run: |
          echo "=========================================="
          echo " Medtronic India Regression — Run #${{ github.run_number }}"
          echo "=========================================="
          echo " Branch  : ${{ github.ref_name }}"
          echo " Trigger : ${{ github.event_name }}"
          echo "=========================================="

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Regression Tests
        continue-on-error: true
        env:
          TESTRAIL_HOST:       ${{ secrets.TESTRAIL_HOST }}
          TESTRAIL_USER:       ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY:    ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
          TESTRAIL_SUITE_ID:   ${{ secrets.TESTRAIL_SUITE_ID }}
          TESTRAIL_SECTION_ID: ${{ secrets.TESTRAIL_SECTION_ID }}
        run: |
          npx playwright test src/web/tests/nav/medtronic-*.spec.js \
            --config=config/playwright.config.js \
            --project=chromium

      - name: 📊 Generate test report
        if: always()
        run: |
          echo "Test execution completed"
          if [ -d "playwright-report" ]; then
            echo "Report generated successfully"
          fi

      - name: 📦 Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medtronic-playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: 📦 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medtronic-test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 30

      - name: 📧 Prepare email content
        if: always()
        run: node scripts/generate-email.js
        env:
          REPORT_TITLE:      'Medtronic India Automation'
          GITHUB_SERVER_URL:  ${{ github.server_url }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
          GITHUB_RUN_NUMBER:  ${{ github.run_number }}
          GITHUB_REF_NAME:    ${{ github.ref_name }}
          GITHUB_ACTOR:       ${{ github.actor }}
          GITHUB_SHA:         ${{ github.sha }}

  # ── Targeted: run a specific Medtronic feature spec ────────────────────────
  targeted:
    name: 🏥 Targeted — ${{ github.event.inputs.test_scope }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      !contains(fromJSON('["smoke","regression","all"]'), github.event.inputs.test_scope)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: 📋 Log run context
        run: |
          echo "=========================================="
          echo " Medtronic Targeted: ${{ github.event.inputs.test_scope }}"
          echo " Reason : ${{ github.event.inputs.run_reason }}"
          echo "=========================================="

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Targeted Tests
        continue-on-error: true
        env:
          TESTRAIL_HOST:       ${{ secrets.TESTRAIL_HOST }}
          TESTRAIL_USER:       ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY:    ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
          TESTRAIL_SUITE_ID:   ${{ secrets.TESTRAIL_SUITE_ID }}
          TESTRAIL_SECTION_ID: ${{ secrets.TESTRAIL_SECTION_ID }}
        run: |
          npx playwright test \
            src/web/tests/nav/medtronic-${{ github.event.inputs.test_scope }}.spec.js \
            --config=config/playwright.config.js \
            --project=chromium

      - name: 📦 Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medtronic-${{ github.event.inputs.test_scope }}-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
